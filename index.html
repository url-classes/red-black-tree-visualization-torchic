<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol Rojo-Negro</title>
    <link rel="stylesheet" href="styles.css"> <!-- Enlace al archivo CSS -->
</head>
<body>
    <div class="container">
        <h1>Árbol <span style="color: red;">Rojo</span>-Negro</h1>
        
        <div class="input-group">
            <input type="number" id="insertNumber" placeholder="Número a insertar">
            <button id="insertButton">Insertar</button>
        </div>
        
        <div class="input-group">
            <input type="number" id="deleteNumber" placeholder="Número a eliminar">
            <button id="deleteButton">Eliminar</button>
        </div>
        
        <div class="input-group">
            <button id="inorderButton">Inorder</button>
            <button id="posorderButton">Posorder</button>
            <button id="preorderButton">Preorder</button>
        </div>

        <!-- Contenedor para el árbol -->
        <div class="tree-container">
            <div class="node" style="background-color: black; color: white;">10</div>
            <div class="node" style="background-color: red; color: white;">5</div>
            <div class="node" style="background-color: red; color: white;">15</div>
            <!-- Agrega más nodos según sea necesario -->
        </div>

        <div id="floating-message" class="floating-message"></div>
    </div>

    <script src="./ArbolRojoNegro/rbt.js" type="module" defer></script>
    <script>
        document.getElementById('insertButton').onclick = () => {
            insertarDesdeHTML();
        };
    </script>
</body>
</html>
